<!DOCTYPE html>
<html lang="de" data-mode="dark" data-density="compact">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediaMTX Monitor</title>

  <!-- 
    🧾 Projekt: Mediamtx Stream Monitor
    Beschreibung:
      - Zeigt laufende MediaMTX-Streams übersichtlich an
      - Nutzt REST-API (GET /api/streams)
      - Automatische Aktualisierung alle 5 Sekunden
    Bestandteile:
      - CSS-Styles für visuelles Layout
      - JavaScript-Fetch für API-Daten
      - dynamisches DOM-Rendering
    Autor: snowgames.live
    Lizenz: MIT
  -->

  <!-- UI-Tokens (RICHTER.PROJECTS UI-Standard 1.0) vor dem eigenen Stylesheet -->
  <link rel="stylesheet" href="/static/css/ui-tokens.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body>
  <header class="topbar">
    <div class="topbar-brand" id="page-title">MediaMTX Monitor</div>
    <div class="topbar-ctx" id="topbar-ctx"></div>
    <div class="topbar-conn" id="topbar-conn"></div>
  </header>
  <section id="systeminfo" aria-label="Systeminformationen"></section>
  <div id="no-streams" style="display: none;">Keine Streams aktiv.</div>
  <div id="streams"></div>
  <footer class="foot">
    <span id="foot-version">MediaMTX Monitor</span>
    <a href="/api/streams">Daten: /api/streams</a>
    <a href="https://github.com/richtertoralf/mediamtxMonitor" rel="noopener">Dokumentation</a>
  </footer>

  <!-- JavaScript-Module laden -->
  <script type="module" src="/static/js/main.js"></script>
</body>

</html>
